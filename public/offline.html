<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>オフライン / Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc; color: #0f172a;
      }
      @media (prefers-color-scheme: dark) { body { background: #020617; color: #e2e8f0; } }
      .card { max-width: 22rem; text-align: center; padding: 2rem; }
      .mark {
        width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 1.25rem;
        background: linear-gradient(135deg, #6366f1, #4f46e5);
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0.25rem 0; color: #64748b; }
      @media (prefers-color-scheme: dark) { p { color: #94a3b8; } }
      button {
        margin-top: 1.5rem; padding: 0.6rem 1.2rem; border: 0; border-radius: 9999px;
        background: #4f46e5; color: #fff; font-size: 0.9rem; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"></div>
      <h1>オフラインです</h1>
      <p>インターネット接続を確認してください。</p>
      <p>You're offline. Check your connection.</p>
      <button onclick="location.reload()">再試行 / Retry</button>
    </div>
  </body>
</html>
